name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn clean test

      - name: Verify build
        run: mvn verify -DskipTests

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start mock services
        run: docker compose up -d simulado
        working-directory: .

      - name: Wait for mocks to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/product/1 && break
            echo "Waiting for simulado... ($i/30)"
            sleep 2
          done

      - name: Run integration tests
        run: mvn test -Dtest="*IntegrationTest" -DfailIfNoTests=false

      - name: Stop services
        if: always()
        run: docker compose down
        working-directory: .
